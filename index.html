<!DOCTYPE html>
<html>
<head>
  <title>Welcome to My World</title>
  <style>
    body {
      background: linear-gradient(135deg, #00C9FF, #92FE9D);
      color: white;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 60px;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 24px;
      margin-top: 20px;
      animation: slideUp 2s ease-in-out;
    }

    .button {
      background-color: #ffffff;
      color: #333;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 40px;
      transition: all 0.3s;
    }

    .button:hover {
      background-color: #333;
      color: white;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes slideUp {
      from {transform: translateY(30px); opacity: 0;}
      to {transform: translateY(0); opacity: 1;}
    }
  </style>
</head>
<body>
  <h1>👋 Hey there!</h1>
  <p>Welcome to my little corner of the internet.</p>
  <button class="button" onclick="alert('You’re awesome ✨')">Click Me</button>
</body>
</html>
